<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f9e3e3"><title>A little date invitation 💗</title><link rel="stylesheet" href="styles.css"></head><body><main class="container"><span class="eyebrow">A LITTLE QUESTION FOR YOU</span><h1>Will you go on a date with me today? 💗</h1><p class="subtitle">A little time together. A lot to smile about.</p><div class="gif_container"><img src="assets/invite.gif" alt="A cute animated character inviting you on a date" width="260" height="260"></div><div class="buttons"><button class="yes-button" onclick="handleYesClick()">Yes 💕</button><button class="no-button" onclick="handleNoClick()">No 🥺</button></div><p id="no-message" aria-live="polite"></p><button id="decline" class="text-button" hidden>Really no, maybe another day 💌</button><section id="decline-panel" hidden><p>That's okay! Send your answer?</p><button id="send-decline">Send my no 💌</button><button id="cancel-decline" class="text-button">Go back</button></section><p id="status" role="status" aria-live="polite"></p><footer>Made with love · Inspired by <a href="https://github.com/ivysone/Will-you-be-my-Valentine-">ivysone</a></footer></main><script src="config.js"></script><script src="booking.js"></script><script src="script.js"></script></body></html>
